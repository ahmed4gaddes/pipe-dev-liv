name: Deploy Pipeline

# Déclenché par pipeline-service (GitHubActionsClient.triggerWorkflow, Phase 5) via
# POST /repos/{owner}/{repo}/actions/workflows/deploy.yml/dispatches. Le nom de ce fichier
# est en dur côté backend (application.yml -> github.workflow-file: deploy.yml) : ne pas renommer.
#
# Pas d'étape "notify backend" ici : le webhook natif GitHub workflow_run (une fois le webhook
# du dépôt configuré, voir docs/runner-setup.md §5) prévient déjà pipeline-service quand ce run
# se termine — WebhookController + PipelineServiceImpl.handleWorkflowRunEvent gèrent tout,
# y compris la récupération des jobs/étapes via l'API REST. Un échec de job ici se traduit
# naturellement en conclusion "failure" -> PipelineStatus.FAILED côté ticket.
#
# Le job tourne sur un runner self-hosted, sur la même machine que le reste de la stack locale,
# donc "Health check" peut réellement joindre http://localhost:8080.
#
# runner_label : quand plusieurs développeurs enregistrent chacun leur runner sur ce dépôt, ils
# partagent tous le label "self-hosted" et GitHub attribue le job au premier runner libre — un
# déploiement déclenché par l'un peut donc s'exécuter sur la machine de l'autre, et redéployer
# la mauvaise stack. Chaque instance de pipeline-service envoie ici le label de SA machine
# (github.runner-label, alimenté par GH_RUNNER_LABEL dans son .env) pour viser son propre
# runner. La valeur par défaut "self-hosted" conserve l'ancien comportement pour toute
# instance qui n'envoie pas l'input.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible'
        type: choice
        required: true
        options: [dev, test, prod]
        default: dev
      ticket_id:
        description: 'ID du ticket qui déclenche ce déploiement'
        required: true
        type: string
      runner_label:
        description: 'Label du runner devant exécuter ce déploiement (voir en-tête du fichier)'
        required: false
        type: string
        default: self-hosted

jobs:
  deploy:
    runs-on: ${{ inputs.runner_label }}
    steps:
      - uses: actions/checkout@v4

      # NE PAS copier .env.example ici : docker compose (sans project name explicite) nomme son
      # projet d'après le dossier courant, identique à celui du clone de dev sur cette même
      # machine ("pipe-dev-liv") -> "docker compose up" recrée LES MÊMES conteneurs que la stack
      # locale. Un .env de placeholders (DB_PASSWORD=CHANGE_ME, etc.) écraserait alors les vrais
      # secrets et ferait crash-looper les services (auth DB invalide) à chaque déploiement.
      #
      # STACK_DIR = chemin du clone qui héberge la stack locale (celui où vous lancez
      # docker compose). À définir dans le fichier .env du runner self-hosted — voir
      # docs/runner-setup.md. Chemin propre à chaque machine, donc jamais en dur ici.
      - name: Setup environment variables
        shell: bash
        run: |
          if [ -z "${STACK_DIR:-}" ]; then
            echo "::error::STACK_DIR n'est pas défini. Ajoutez-le au fichier .env du runner self-hosted (voir docs/runner-setup.md)."
            exit 1
          fi
          if [ ! -f "$STACK_DIR/.env" ]; then
            echo "::error::Fichier introuvable : $STACK_DIR/.env — vérifiez STACK_DIR et créez le .env depuis .env.example."
            exit 1
          fi
          cp "$STACK_DIR/.env" .env

      - name: Build images
        run: docker compose build user-service ticket-service pipeline-service notification-service audit-service

      - name: Deploy (stack locale)
        run: docker compose up -d user-service ticket-service pipeline-service notification-service audit-service

      - name: Health check
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::api-gateway n'a pas répondu healthy après 30s"
          exit 1

      - name: Résumé du déploiement
        if: always()
        shell: bash
        run: |
          echo "### Déploiement — environnement \`${{ inputs.environment }}\`, ticket #${{ inputs.ticket_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run déclenché par pipeline-service, run id \`${{ github.run_id }}\`." >> "$GITHUB_STEP_SUMMARY"
