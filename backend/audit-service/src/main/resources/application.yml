server:
  port: 8085

spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/audit_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

# Secret partagé injecté dans le header X-Internal-Secret sur chaque requête proxyfiée vers
# ce microservice, pour prouver que la requête est bien passée par la Gateway (voir
# common-lib SecurityConfig / HeaderAuthenticationFilter).
security:
  internal:
    gateway-secret: ${GATEWAY_INTERNAL_SECRET}

logging:
  level:
    com.pipedevliv.audit: DEBUG
