server:
  port: 8082

spring:
  application:
    name: ticket-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/tickets_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}

eureka:
  instance:
    # ID stable (indépendant du hostname du conteneur, qui change à chaque recreate) : sans ça,
    # chaque `docker compose up --force-recreate` laisse une entrée DOWN fantôme dans Eureka à
    # côté de la nouvelle instance UP, et le load-balancer de la gateway route ~1 requête sur 2
    # vers l'instance morte tant que le bail n'a pas expiré.
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

# Requis par common-lib (HeaderAuthenticationFilter) : sans ça le service refuse de démarrer.
security:
  internal:
    gateway-secret: ${GATEWAY_INTERNAL_SECRET}

logging:
  level:
    com.pipedevliv.ticket: DEBUG
