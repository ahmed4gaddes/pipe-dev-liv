# spring-dotenv charge le .env situe a la racine du repo, en utilisant par defaut le
# repertoire de travail du process Java ("./") -- pas de propriete "directory" ici.
# Ca suppose que le repertoire de travail EST la racine du repo :
#   - Maven CLI (mvnw spring-boot:run) : force via workingDirectory dans backend/pom.xml
#     (pluginManagement > spring-boot-maven-plugin).
#   - IntelliJ : verifie que "Working directory" pointe sur la racine du projet dans la
#     Run Configuration (c'est le comportement par defaut observe).
