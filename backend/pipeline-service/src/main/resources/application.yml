server:
  port: 8083

spring:
  application:
    name: pipeline-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/pipelines_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}

  # TicketServiceClient#updatePipelineStatus utilise PATCH, non supporté par le client Feign
  # par défaut (HttpURLConnection du JDK). Bascule vers Apache HttpClient 5 (feign-hc5).
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true

eureka:
  instance:
    # ID stable (indépendant du hostname du conteneur, qui change à chaque recreate) : sans ça,
    # chaque `docker compose up --force-recreate` laisse une entrée DOWN fantôme dans Eureka à
    # côté de la nouvelle instance UP, et le load-balancer de la gateway route ~1 requête sur 2
    # vers l'instance morte tant que le bail n'a pas expiré.
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

# Requis par common-lib (HeaderAuthenticationFilter) : sans ça le service refuse de démarrer.
security:
  internal:
    gateway-secret: ${GATEWAY_INTERNAL_SECRET}

# GitHub Actions API + vérification de signature des webhooks entrants.
github:
  api-base-url: https://api.github.com
  token: ${GH_PAT_TOKEN}
  owner: ${GH_OWNER}
  repo: ${GH_REPO}
  webhook-secret: ${GH_WEBHOOK_SECRET}
  workflow-file: deploy.yml
  # Label du runner self-hosted qui doit executer les deploiements de CETTE machine.
  # Defaut "self-hosted" = premier runner libre du depot (comportement historique).
  runner-label: ${GH_RUNNER_LABEL:self-hosted}

logging:
  level:
    com.pipedevliv.pipeline: DEBUG
