server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/users_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

# Requis par common-lib (HeaderAuthenticationFilter) : sans ça le service refuse de démarrer.
security:
  internal:
    gateway-secret: ${GATEWAY_INTERNAL_SECRET}

logging:
  level:
    com.pipedevliv.user: DEBUG
