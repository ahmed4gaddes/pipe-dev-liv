server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        
        - id: ticket-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/tickets/**
            
        - id: pipeline-service
          uri: lb://pipeline-service
          predicates:
            - Path=/api/pipelines/**

        - id: pipeline-webhooks
          uri: lb://pipeline-service
          predicates:
            - Path=/api/webhooks/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/audit-logs/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_AUTH_SERVER_URL:http://localhost:9090}/realms/${KC_REALM:pipe-dev-liv}
          jwk-set-uri: ${KC_AUTH_SERVER_URL:http://localhost:9090}/realms/${KC_REALM:pipe-dev-liv}/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

# Secret partagé injecté dans le header X-Internal-Secret sur chaque requête proxyfiée vers
# un microservice, pour prouver que la requête est bien passée par la Gateway (voir
# common-lib SecurityConfig / HeaderAuthenticationFilter côté microservices).
security:
  internal:
    gateway-secret: ${GATEWAY_INTERNAL_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
