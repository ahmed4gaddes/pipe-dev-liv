# ==============================================================================
#  Profil PROD — Environnement de production
# ==============================================================================

spring:
  # === PostgreSQL ===
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/pipe_prod_liv
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # === JPA / Hibernate ===
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  # === Keycloak / OAuth2 ===
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_AUTH_SERVER_URL}/realms/${KC_REALM}
          jwk-set-uri: ${KC_AUTH_SERVER_URL}/realms/${KC_REALM}/protocol/openid-connect/certs

  # === RabbitMQ ===
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}

# === Logging (minimal en PROD) ===
logging:
  level:
    root: WARN
    com.pipedevliv: INFO

# === Actuator (restreint en PROD) ===
management:
  endpoints:
    web:
      exposure:
        include: health,info
