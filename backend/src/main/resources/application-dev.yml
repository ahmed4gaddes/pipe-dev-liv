# ==============================================================================
#  Profil DEV — Développement local
# ==============================================================================

spring:
  # === PostgreSQL ===
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/pipe_dev_liv
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # === JPA / Hibernate ===
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # === Keycloak / OAuth2 ===
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_AUTH_SERVER_URL:http://localhost:9090}/realms/${KC_REALM:pipe-dev-liv}
          jwk-set-uri: ${KC_AUTH_SERVER_URL:http://localhost:9090}/realms/${KC_REALM:pipe-dev-liv}/protocol/openid-connect/certs

  # === RabbitMQ ===
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD}

# === Logging (plus verbeux en DEV) ===
logging:
  level:
    root: INFO
    com.pipedevliv: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
